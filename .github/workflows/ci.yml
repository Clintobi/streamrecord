name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (FHIR bundle, profiles, review rules)
        run: npm test
      - name: Type-check and production build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the data package (frictionless)
        run: pip install --quiet frictionless && frictionless validate public/data/datapackage.json
